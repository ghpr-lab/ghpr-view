name: Flaky Analyzer CI

on:
  push:
    branches: [master]
    paths:
      - ".github/actions/flaky-analyzer/**"
      - ".github/workflows/flaky-analyzer-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - ".github/actions/flaky-analyzer/**"
      - ".github/workflows/flaky-analyzer-ci.yml"

permissions:
  contents: read

concurrency:
  group: flaky-analyzer-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .github/actions/flaky-analyzer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: ./node_modules/.bin/tsc --noEmit

      - name: Test
        run: bun test
