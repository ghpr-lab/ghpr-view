name: Flaky CI Auto-Trigger

on:
  workflow_run:
    workflows: ["Swift", "Flaky Analyzer CI"]
    types: [completed]

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: flaky-ci-auto-trigger-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve PR number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          INLINE_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          PR_NUMBER="${INLINE_PR:-}"
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            PR_NUMBER=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/pulls" \
              -H "Accept: application/vnd.github+json" \
              --jq '[.[] | select(.state=="open")][0].number // empty')
          fi
          if [ -z "$PR_NUMBER" ]; then
            echo "No open PR found for ${HEAD_SHA}; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Dispatch Flaky CI Review
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run flaky-ci-review.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.event.repository.default_branch }}" \
            -f pr_number="${{ steps.pr.outputs.pr_number }}" \
            -f head_sha="${{ github.event.workflow_run.head_sha }}" \
            -f run_id="${{ github.event.workflow_run.id }}" \
            -f trigger="auto-on-failure" \
            -f correlation_id="auto-${{ github.event.workflow_run.id }}"
